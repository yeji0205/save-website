  <!-- ── Video ────────────────────────────────────────────── -->
  <!-- Sits above the wordmark now — that is the order in the new design. -->
  <section class="video">
    <!-- The trailer, served from this site. No YouTube, no third party.

         muted is REQUIRED for autoplay — every browser blocks autoplay with
         sound. Drop it and the video silently refuses to start. The controls
         are how someone turns the sound on.

         preload="auto" follows from autoplay: the file has to be fetched for
         playback to begin, so this cannot be preload="none" any more. That
         means the full download now starts on page load for every visitor,
         not only for people who press play.

         The poster fills the frame until the first frame is decoded. -->

    <!-- The stage is exactly the size of the video frame, with no padding of
         its own. The prop is positioned against IT, so its percentages
         always resolve against the video's real box. -->
    <div class="video__stage">
      <div class="video__frame">
        <video class="video__media"
               src="asset/SAVE_Trailer.mp4"
               poster="asset/trailer_poster.webp"
               controls
               autoplay
               muted
               loop
               preload="auto"
               playsinline
               width="1920" height="1080"></video>

        <!-- Mobile-only tap target that opens the video fullscreen.
             It cannot be the <video> itself: playsinline is required for the
             inline autoplay loop, and with it iOS will not fullscreen on its
             own. So a tap has to ask explicitly.
             It stops short of the bottom edge so it never swallows taps meant
             for the native control bar. Hidden entirely on desktop. -->
        <button type="button" class="video__expand" data-i18n-label="fullscreen"></button>
      </div>

      <!-- One cut-out prop now. motherSeed and nutrition moved down into the
           features rows, which is where the new design puts them. It breaks
           the video's rectangle, so it is a sibling of the frame, not a
           child of it. -->
      <img class="prop prop--tree" src="asset/treeSeed.png" alt="" aria-hidden="true">
    </div>
  </section>

  <!-- ── Hero ─────────────────────────────────────────────── -->
  <section class="hero">
    <!-- grad_green.svg, the gradient exported from the design (node
         2209:1342). It is a direct child of the section, not of .hero__mark,
         so it centres on the hero as a whole — logo AND tagline — rather
         than on the wordmark alone. First child, so it paints behind the
         content without needing a negative z-index. -->
    <img class="hero__glow" src="asset/grad_green.svg" alt="" aria-hidden="true">

    <div class="hero__mark">
      <img class="hero__logo" src="asset/save_logo.png" alt="save">
    </div>

  </section>

  <!-- ── Features ─────────────────────────────────────────── -->

       Each row's glow is the exported gradient behind it; it is the first
       child so it paints behind the content without needing a negative
       z-index (see the grain note in style.css for why that matters). -->
  <section class="features">

    <!-- Row 1 — screenshot left. Design has no exported gradient for this
         row, so it reuses grad_brownGreen (the row-4 gradient, which has the
         same shape in the file). Swap it when the real one is exported. -->
    <article class="feature feature--left">
      <img class="feature__glow feature__glow--1" src="asset/grad_brownGreen.svg" alt="" aria-hidden="true">

      <div class="feature__shot">
        <!-- Animated. Converted from the source GIF to animated WebP: same

             lazy because it is the heaviest asset on the page and sits well
             below the fold. -->
        <img src="asset/bring_back_life.webp" alt="" width="960" height="540"

        <img class="feature__prop feature__prop--seed" src="asset/motherSeed.png" alt="" aria-hidden="true">
