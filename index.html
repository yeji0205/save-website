<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>save</title>
  <meta name="description" content="save — plant the Mother Tree and heal the world.">
  <link rel="icon" href="asset/save_logo.png">

  <!-- KoHo. Weights: 300 body, 400 fallback, 600 for the bold line.
       Italic cuts are loaded too — the whole design is italic. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=KoHo:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ───────────────────────────────────────────── -->
  <header class="header">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="lang__btn" data-lang="de" aria-pressed="false">DE</button>
      <span class="lang__sep" aria-hidden="true">/</span>
      <button type="button" class="lang__btn" data-lang="en" aria-pressed="true">EN</button>
    </div>

    <nav class="socials socials--sm" aria-label="Social links">
      <a class="social" href="https://discord.gg/qd8XH2ea8v"
         target="_blank" rel="noopener noreferrer" data-i18n-label="discord">
        <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.3 5.34A16.7 16.7 0 0 0 15.16 4c-.18.32-.39.75-.53 1.09a15.5 15.5 0 0 0-4.66 0A11.4 11.4 0 0 0 9.43 4a16.6 16.6 0 0 0-4.15 1.34C2.66 9.24 1.95 13.04 2.3 16.79a16.8 16.8 0 0 0 5.09 2.58c.41-.56.78-1.16 1.09-1.79-.6-.22-1.17-.5-1.71-.82.14-.11.28-.22.42-.34a12 12 0 0 0 10.22 0l.42.34c-.54.32-1.11.6-1.71.82.31.63.68 1.23 1.09 1.79a16.7 16.7 0 0 0 5.09-2.58c.42-4.34-.71-8.11-2.99-11.45ZM8.79 14.5c-.99 0-1.81-.91-1.81-2.03 0-1.12.8-2.04 1.81-2.04s1.83.92 1.81 2.04c0 1.12-.8 2.03-1.81 2.03Zm6.42 0c-.99 0-1.81-.91-1.81-2.03 0-1.12.8-2.04 1.81-2.04s1.83.92 1.81 2.04c0 1.12-.8 2.03-1.81 2.03Z"/>
        </svg>
      </a>

      <a class="social" href="https://www.tiktok.com/@save.nature.game"
         target="_blank" rel="noopener noreferrer" data-i18n-label="tiktok">
        <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5 2.59 2.59 0 0 1 0-5.18c.27 0 .53.04.77.12V9.68a5.85 5.85 0 0 0-.77-.05 5.69 5.69 0 1 0 5.69 5.69V9.01a7.35 7.35 0 0 0 4.29 1.37V7.3a4.29 4.29 0 0 1-3.24-1.48Z"/>
        </svg>
      </a>
    </nav>
  </header>

  <!-- ── Hero ─────────────────────────────────────────────── -->
  <section class="hero">
    <!-- The glow lives inside this wrapper so it is centred on the logo
         itself, not on the section. -->
    <div class="hero__mark">
      <div class="hero__glow" aria-hidden="true"></div>
      <img class="hero__logo" src="asset/save_logo.png" alt="save">
    </div>

    <p class="hero__tagline" data-i18n-html="tagline"></p>
  </section>

  <!-- ── Video ────────────────────────────────────────────── -->
  <section class="video">
    <!-- PLACEHOLDER. When the .mp4 is ready, replace the <img> below with:
           <video class="video__media" poster="asset/poster.jpg" playsinline
                  src="asset/trailer.mp4"></video>
         and main.js will wire the play button to it automatically. -->
    <!-- The stage is exactly the size of the video frame, with no padding of
         its own. The props are positioned against IT, so their percentages
         always resolve against the video's real box. -->
    <div class="video__stage">
      <div class="video__frame">
        <img class="video__media" src="asset/destroyed.png" alt="" width="1280" height="720">
        <button type="button" class="video__play" data-i18n-label="playVideo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M9 6.5v11l9-5.5-9-5.5Z"/>
          </svg>
        </button>
      </div>

      <!-- Cut-out props. They deliberately break the video's rectangle, so
           they are siblings of the frame, not children of it. -->
      <img class="prop prop--tree"      src="asset/treeSeed.png"   alt="" aria-hidden="true">
      <img class="prop prop--mother"    src="asset/motherSeed.png" alt="" aria-hidden="true">
      <img class="prop prop--nutrition" src="asset/nutrition.png"  alt="" aria-hidden="true">
    </div>
  </section>

  <!-- ── About ────────────────────────────────────────────── -->
  <section class="about">
    <!-- Same wrapper trick as the hero: the glow is centred inside this box,
         and the box is exactly the selfie's size, so the halo blooms from the
         photo itself. It still spreads down over the text below. -->
    <div class="about__mark">
      <img class="about__avatar" src="asset/selfi.png" alt="Yegi Park and Etienne Kiefer">
    </div>
    <p class="about__text" data-i18n="about"></p>
    <p class="about__follow" data-i18n="follow"></p>

    <nav class="socials" aria-label="Social links">
      <a class="social" href="https://discord.gg/qd8XH2ea8v"
         target="_blank" rel="noopener noreferrer" data-i18n-label="discord">
        <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.3 5.34A16.7 16.7 0 0 0 15.16 4c-.18.32-.39.75-.53 1.09a15.5 15.5 0 0 0-4.66 0A11.4 11.4 0 0 0 9.43 4a16.6 16.6 0 0 0-4.15 1.34C2.66 9.24 1.95 13.04 2.3 16.79a16.8 16.8 0 0 0 5.09 2.58c.41-.56.78-1.16 1.09-1.79-.6-.22-1.17-.5-1.71-.82.14-.11.28-.22.42-.34a12 12 0 0 0 10.22 0l.42.34c-.54.32-1.11.6-1.71.82.31.63.68 1.23 1.09 1.79a16.7 16.7 0 0 0 5.09-2.58c.42-4.34-.71-8.11-2.99-11.45ZM8.79 14.5c-.99 0-1.81-.91-1.81-2.03 0-1.12.8-2.04 1.81-2.04s1.83.92 1.81 2.04c0 1.12-.8 2.03-1.81 2.03Zm6.42 0c-.99 0-1.81-.91-1.81-2.03 0-1.12.8-2.04 1.81-2.04s1.83.92 1.81 2.04c0 1.12-.8 2.03-1.81 2.03Z"/>
        </svg>
      </a>

      <a class="social" href="https://www.tiktok.com/@save.nature.game"
         target="_blank" rel="noopener noreferrer" data-i18n-label="tiktok">
        <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5 2.59 2.59 0 0 1 0-5.18c.27 0 .53.04.77.12V9.68a5.85 5.85 0 0 0-.77-.05 5.69 5.69 0 1 0 5.69 5.69V9.01a7.35 7.35 0 0 0 4.29 1.37V7.3a4.29 4.29 0 0 1-3.24-1.48Z"/>
        </svg>
      </a>
    </nav>
  </section>

  <!-- ── Footer ───────────────────────────────────────────── -->
  <footer class="footer">
    <a class="footer__link" href="imprint.html" data-i18n="imprint">Imprint</a>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
