name: Deploy to GitHub Pages

# Runs on every push to main, and can also be triggered by hand from the
# Actions tab (the "Run workflow" button).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy step needs. Without these it fails with a 403.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run rather than racing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci installs exactly what package-lock.json specifies.
      - run: npm ci

      - run: npm run build

      # Hand the built dist/ folder to the deploy job.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
